<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url("file:///home/claude/hotfix_wk/tools/shorts/assets/fonts/Pretendard-Black.otf");font-weight:900}
@font-face{font-family:P;src:url("file:///home/claude/hotfix_wk/tools/shorts/assets/fonts/Pretendard-ExtraBold.otf");font-weight:800}
@font-face{font-family:P;src:url("file:///home/claude/hotfix_wk/tools/shorts/assets/fonts/Pretendard-Bold.otf");font-weight:700}
@font-face{font-family:P;src:url("file:///home/claude/hotfix_wk/tools/shorts/assets/fonts/Pretendard-Medium.otf");font-weight:500}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#F4F6FA;font-family:P,sans-serif;color:#141B3A}
*{box-sizing:border-box}
#bg{position:absolute;left:0;top:0;width:1080px;height:1920px;background:radial-gradient(1200px 900px at 20% 10%,#E9EDF7,transparent),radial-gradient(900px 900px at 90% 90%,#FFF4C2,transparent)}
#prog{position:absolute;left:0;top:0;height:10px;background:#FFD84D;z-index:9}
#title{z-index:5;position:absolute;left:80px;width:770px;top:280px;font-weight:900;font-size:76px;line-height:1.15;letter-spacing:-3px;word-break:keep-all}
#title .y{background:linear-gradient(transparent 62%,#FFD84D 62%)}
.sc{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0}
.phone{position:absolute;left:290px;top:430px;width:500px;height:1030px;border-radius:56px;background:#141B3A;padding:14px;box-shadow:0 30px 70px rgba(20,27,58,.25)}
.phone .scr{width:100%;height:100%;border-radius:44px;overflow:hidden;background:#fff;position:relative}
.phone img{position:absolute;left:0;top:0;width:100%}
.paper{position:absolute;left:190px;top:500px;width:700px;border-radius:14px;overflow:hidden;box-shadow:0 30px 70px rgba(20,27,58,.22);background:#fff}
.paper img{display:block;width:100%}
.tag{position:absolute;background:#141B3A;color:#FFD84D;font-weight:800;font-size:30px;border-radius:999px;padding:6px 22px}
#cap{position:absolute;left:80px;width:920px;top:1500px;text-align:center;z-index:8}
#cap span.box{display:inline-block;background:rgba(20,27,58,.92);color:#fff;border-radius:22px;padding:18px 30px;font-weight:800;font-size:50px;line-height:1.3;word-break:keep-all}
#cap i{font-style:normal}#cap i.on{color:#FFD84D}
.ring{position:absolute;border:8px solid #FFD84D;border-radius:24px;box-shadow:0 0 0 6px rgba(255,216,77,.25)}
.dots{position:absolute;left:120px;width:840px;top:600px;display:flex;justify-content:space-between}
.dot{width:240px;height:240px;border-radius:50%;background:#fff;border:6px solid #D3D8E3;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:58px}
.dot small{font-size:30px;font-weight:700;color:#5A6178}
.dot.on{background:#141B3A;color:#fff;border-color:#141B3A}.dot.on small{color:#FFD84D}
#line{position:absolute;left:240px;top:715px;height:10px;background:#141B3A;border-radius:5px}
.grad{position:absolute;left:120px;width:840px;top:930px;text-align:center;font-weight:900;font-size:60px;letter-spacing:-2px}
.mini{position:absolute;left:240px;top:1060px;width:600px;border-radius:30px;overflow:hidden;box-shadow:0 20px 50px rgba(20,27,58,.18)}
.mini img{width:100%;display:block}
#end{background:#16204A;color:#fff}
#end .big{position:absolute;left:80px;width:920px;top:520px;text-align:center;font-weight:900;font-size:120px;letter-spacing:-4px;line-height:1.1}
#end .big b{color:#FFD84D}
#end .sub{position:absolute;left:80px;width:920px;top:820px;text-align:center;font-weight:800;font-size:52px;color:#C9CFE6}
#end .url{position:absolute;left:240px;width:600px;top:960px;text-align:center;font-weight:900;font-size:58px;background:#FFD84D;color:#141B3A;border-radius:999px;padding:22px 0}
#end .logo{position:absolute;left:0;width:1080px;top:1180px;text-align:center;font-weight:900;font-size:64px}
#end .logo i{display:inline-block;width:44px;height:44px;border:10px solid #FF6B5E;border-radius:50%;vertical-align:-4px;margin-right:16px}
</style></head><body>
<div id="bg"></div><div id="prog"></div>
<div id="title"></div>
<div class="sc" id="s1"><div class="phone"><div class="scr"><img id="i1" src="1_home.png"></div></div></div>
<div class="sc" id="s2"><div class="phone"><div class="scr"><img id="i2" src="g2.png"><div class="ring" id="r2" style="left:20px;top:205px;width:450px;height:136px;opacity:0"></div></div></div></div>
<div class="sc" id="s3"><div class="phone"><div class="scr"><img id="i3" src="4_map.png"></div></div><span class="tag" style="left:800px;top:470px">견본</span></div>
<div class="sc" id="s4"><div id="line"></div><div class="dots"><div class="dot" id="d1">하루<small>1일 뒤</small></div><div class="dot" id="d2">사흘<small>3일 뒤</small></div><div class="dot" id="d3">일주일<small>7일 뒤</small></div></div>
  <div class="grad" id="gr">틀린 유형만, 숫자를 바꿔서</div></div>
<div class="sc" id="s5"><div class="paper"><img src="5_pdf-02.png"></div></div>
<div class="sc" id="end"><div class="big">1주 무료 체험</div><div class="sub">자동 결제 없음 · 프로필 링크</div><div class="url">munjesaem.kr</div><div class="logo"><i></i>문제샘</div></div>
<div id="cap"></div>
<script>
// [시작초, 대사]. 목소리가 오면 lines.json 타이밍으로 바꾼다
window.LINES=window.LINES||[[0.0,"채점은 매일 하는데 모아서 보신 적 있나요"],[3.1,"채점하면서 틀린 문제와 이유를 눌러 두면"],[6.2,"부족한 유형과 실수 습관이 모여요"],[8.8,"틀린 유형은 숫자만 바꿔 하루 뒤 사흘 뒤 일주일 뒤에 다시 풀어요"],[13.5,"한 주 기록은 지난주와 비교한 주간 리포트 한 장으로 정리돼요"],[18.1,"학습 관리는 일주일 무료로 먼저 써 보세요"]];
window.VEND=window.VEND||21.2;window.END=window.END||22.7;
const TITLES=['모아서 <span class="y">보신 적</span><br>있나요?','틀린 <span class="y">이유</span>를<br>눌러요','약한 유형이<br><span class="y">한눈에</span>','<span class="y">1·3·7일</span> 뒤<br>다시 풀어요','지난주와<br><span class="y">비교</span>해요',''];
const $=id=>document.getElementById(id),cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),io=(t,a,d=.35)=>cl((t-a)/d),ease=x=>1-Math.pow(1-x,3);
function seek(t){const L=LINES.map(x=>x[0]);let k=0;for(let i=0;i<L.length;i++)if(t>=L[i])k=i;
  $("prog").style.width=(1080*Math.min(1,t/END))+"px";
  const ids=["s1","s2","s3","s4","s5","end"];
  ids.forEach((id,i)=>{const on=i===k,q=ease(io(t,L[i],.32));$(id).style.opacity=on?(i===0?1:q):0;$(id).style.transform=on&&i>0?`translateX(${(1-q)*380}px)`:"none"});
  const tq=ease(io(t,L[k],.3));$("title").innerHTML=TITLES[k];$("title").style.opacity=k===5?0:tq;$("title").style.transform=`translateY(${(1-tq)*30}px)`;
  // 화면 천천히 아래로 · 확대
  const u=(t-L[k]);
  $("i1").style.transform=`translateY(${-Math.min(260,u*60)}px)`;
  $("i2").style.transform="none";
  $("r2").style.opacity=k===1?ease(io(t,L[1]+0.4,.3)):0;const mv=ease(io(t,L[1]+1.5,.35));$("r2").style.top=(160+mv*150)+"px";$("r2").style.height=(104+mv*60)+"px";
  $("i3").style.transform=`translateY(${-Math.min(220,u*80)}px)`;
  // 1·3·7
  const s4=L[3];[["d1",.6],["d2",1.6],["d3",2.6]].forEach(([id,dt])=>{$(id).className="dot"+(t>s4+dt?" on":"")});
  $("line").style.width=(cl((t-s4-.6)/2)*600)+"px";$("gr").style.opacity=ease(io(t,s4+3.0,.35));
  { const z=ease(cl((t-L[4]-1.2)/2.5));const pp=document.querySelector(".paper");pp.style.transformOrigin="50% 30%";pp.style.transform="scale("+(1+z*0.18)+")"; }
  // 끝 장면
  if(k===5){const q=ease(io(t,L[5],.35));document.querySelector("#end .big").style.transform=`scale(${.85+.15*q})`}
  // 자막: 단어별, 지금 단어 노랑. 끝 장면 뒤에는 숨김
  const e=k<L.length-1?L[k+1]:VEND,w=LINES[k][1].split(" "),span=Math.max(.6,(e-L[k])-.2);let cur=Math.floor(cl((t-L[k])/span,0,.999)*w.length);
  $("cap").style.opacity=t<VEND?1:0;$("cap").innerHTML='<span class="box">'+w.map((x,i)=>`<i class="${i===cur?"on":""}">${x}</i>`).join(" ")+'</span>';
}
seek(0);
</script></body></html>
